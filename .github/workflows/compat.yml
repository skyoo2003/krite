name: compat

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jev-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - run: scripts/check-compat.sh
