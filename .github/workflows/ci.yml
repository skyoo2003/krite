# Runs the repository checks (scripts/check-*.sh) on pushes to main and on pull requests.
# compat drives a weight-free server through the official Jev SDK (compat/jev).
# macOS arm64, the development platform: the Metal features compile; tests needing a GPU or model
# weights stay #[ignore]d. The network-marked bench tests download the mmBERT tokenizer.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {contents: read}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
      - run: scripts/check-rust.sh
  python:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        check: [spec, bench, train]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/check-${{ matrix.check }}.sh
  compat:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - run: scripts/check-compat.sh
