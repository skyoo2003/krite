# Publishes one package per tag, `<package>-vX.Y.Z`, after checking the tag against the package's
# manifest. Every package has its own version line; the procedure is in RELEASING.md.
# Both registries use Trusted Publishing; a rerun skips a version that is already published. `krite`
# (python/) ships wheels (macOS arm64, Linux x86_64) and an sdist that embed the crates at the tag.
name: release
on:
  push:
    tags:
      - "krite-bench-v*"
      - "krite-train-v*"
      - "krite-core-v*"
      - "krite-runtime-v*"
      - "krite-candle-v*"
      - "krite-server-v*"
      - "krite-cli-v*"
      - "krite-v*"
permissions: {}
jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      package: ${{ steps.tag.outputs.package }}
      registry: ${{ steps.tag.outputs.registry }}
      version: ${{ steps.tag.outputs.version }}
      dir: ${{ steps.tag.outputs.dir }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches its manifest
        id: tag
        run: |
          package="${GITHUB_REF_NAME%-v*}" v="${GITHUB_REF_NAME##*-v}"
          case "$package" in
            krite-bench) registry=pypi dir=benchmarks ;;
            krite-train) registry=pypi dir=training ;;
            krite-core|krite-runtime|krite-candle|krite-server|krite-cli) registry=crates dir="crates/$package" ;;
            krite) registry=wheels dir=python ;;
            *) echo "FAIL: unknown package $package" >&2; exit 1 ;;
          esac
          f="$dir/$([ "$registry" = crates ] && echo Cargo.toml || echo pyproject.toml)"
          grep -qx "version = \"$v\"" "$f" || { echo "FAIL: $f is not $v" >&2; exit 1; }
          { echo "package=$package"; echo "registry=$registry"; echo "version=$v"; echo "dir=$dir"; } >> "$GITHUB_OUTPUT"
  pypi:
    needs: version
    if: needs.version.outputs.registry == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --no-sources "${{ needs.version.outputs.dir }}" -o dist
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
  crates:
    needs: version
    if: needs.version.outputs.registry == 'crates'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish, unless this version is already on crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ needs.version.outputs.package }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if curl -sf -A "krite-release (github.com/skyoo2003/krite)" "https://crates.io/api/v1/crates/$PACKAGE/$VERSION" >/dev/null; then
            echo "$PACKAGE $VERSION already published"
          else
            cargo publish -p "$PACKAGE" --locked
          fi
  wheels:
    needs: version
    if: needs.version.outputs.registry == 'wheels'
    strategy:
      matrix:
        include:
          - {os: macos-latest, target: aarch64-apple-darwin, manylinux: auto}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_28"}
    runs-on: ${{ matrix.os }}
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with: {name: "wheels-${{ matrix.target }}", path: python/dist}
  sdist:
    needs: version
    if: needs.version.outputs.registry == 'wheels'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with: {working-directory: python, command: sdist, args: --out dist}
      - uses: actions/upload-artifact@v7
        with: {name: sdist, path: python/dist}
  wheels-publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write}
    steps:
      - uses: actions/download-artifact@v8
        with: {path: dist, merge-multiple: true}
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*
