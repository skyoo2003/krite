[project]
name = "krite-bench"
version = "0.1.0"
readme = "README.md"
description = "Benchmark harness that measures any /v1/systemone engine under docs/benchmark-spec.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.27",
  "huggingface_hub>=0.23",
  "jsonschema>=4.21",
  "numpy>=1.26",
  "pyarrow>=15",
  "tokenizers>=0.19",
]

[project.urls]
Repository = "https://github.com/skyoo2003/krite"

[project.scripts]
krite-bench = "krite_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/krite_bench"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs Hugging Face Hub access (cached after first run)"]
