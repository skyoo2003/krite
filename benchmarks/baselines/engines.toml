# Baseline engines. Every engine is reached only through POST /v1/systemone on `port`.
# `install` and `start` run with cwd = benchmarks/baselines and, when `venv = true`, with
# .venvs/<engine> activated. `backend`/`precision` use the benchmark-spec §1 values and are
# confirmed against the running engine (shims report `x-bench-device`).
# `request_model`, when set, is sent as the request `model` field ({dataset} is substituted).

[fake]
port = 8199
venv = false
model = "fake"
backend = "none"
precision = "none"
start = "python3 shims/fake_shim.py --port 8199"

[fake-biased]
port = 8198
venv = false
model = "fake-biased"
backend = "none"
precision = "none"
start = "python3 shims/fake_shim.py --biased --port 8198"

[laya]
port = 8101
venv = true
model = "convaiinnovations/laya"
revision = "55cf4c4e"
backend = "torch-mps"
precision = "fp32"
install = "uv pip install laya==0.3.23"
start = "python shims/laya_shim.py --model convaiinnovations/laya --revision 55cf4c4e --port 8101"

[laya-ml]
port = 8106
venv = true
venv_from = "laya"
model = "convaiinnovations/laya-multilingual"
revision = "e4e9ddf2"
backend = "torch-mps"
precision = "fp32"
start = "python shims/laya_shim.py --model convaiinnovations/laya-multilingual --revision e4e9ddf2 --port 8106"

[kev]
port = 8102
venv = false  # Kev manages its own uv environment inside vendor/kev
model = "jaredpalmer/kev-0.8b"
revision = "bf75a6a8"  # snapshot Kev pins at `commit`; reported by its server at startup
dialect = "jev"
repo = "https://github.com/jaredpalmer/kev"
commit = "952ce9d053f6c958d1447c57c36cc9cb3369aef4"
backend = "mlx"
precision = "bf16"
install = "git -C vendor/kev checkout -q 952ce9d053f6c958d1447c57c36cc9cb3369aef4 && (cd vendor/kev && uv sync --extra serve)"
start = "cd vendor/kev && uv run --extra serve python -m kev.serve --run jaredpalmer/kev-0.8b --port 8102"

[semif]
port = 8103
venv = true
model = "Qwen/Qwen3-0.6B"
revision = "c1899de2"
repo = "https://github.com/guoyinchen/SemIf"
commit = "ca3ba65f142967030ecb453346e94d6f476a69df"
backend = "torch-mps"
precision = "bf16"
install = "git -C vendor/SemIf checkout -q ca3ba65f142967030ecb453346e94d6f476a69df && uv pip install -e 'vendor/SemIf[mlx]'"
start = "python shims/semif_shim.py --model Qwen/Qwen3-0.6B --revision c1899de289a04d12100db370d81485cdf75e47ca --port 8103"

# GPL-3.0: black-box process only. Never open, read, copy, or vendor its source (Krite is Apache-2.0).
[cbjev]
port = 8000  # cbjev-serve's documented default address is 127.0.0.1:8000
venv = true
model = "0010101010-1/cbjev"
revision = "a921c4ee"
backend = "torch-mps"
precision = "fp32"
install = "uv pip install 'cbjev[serve] @ git+https://github.com/tomek7667/cbjev@a83908dcf3d0282cc28cb0acdbc7fb6c9aa206c3'"
start = "cbjev-serve"
dialect = "jev"  # routes English vs. multilingual weights itself (response `routing` field)
env = { CBJEV_DEVICE = "mps", CBJEV_PRELOAD = "1" }

# Krite itself. Build first with `cargo build --release -p krite-cli` at the repo root, and export the
# model directory with `cd training && uv run python -m krite_train.export --ckpt ckpt/late8`.
[krite]
port = 8110
venv = false
model = "krite-0.15b-v0"
backend = "candle-metal"
precision = "fp32"
start = "../../target/release/krite serve --port 8110 --model ../../training/ckpt/late8/candle"

# Uncalibrated probabilities: the only engine to fit temperatures on (`krite_train.export --engine krite-raw`).
[krite-raw]
port = 8138
venv = false
model = "krite-0.15b-v0"
backend = "candle-metal"
precision = "fp32"
start = "../../target/release/krite serve --port 8138 --model ../../training/ckpt/late8/candle --raw"

# Both caches off (state memory and candidate lower layers): cache hit vs. miss (ARCHITECTURE.md I3).
[krite-nocache]
port = 8137
venv = false
model = "krite-0.15b-v0"
backend = "candle-metal"
precision = "fp32"
start = "../../target/release/krite serve --port 8137 --model ../../training/ckpt/late8/candle --state-cache-mb 0 --candidate-cache-mb 0"

[classifier]
port = 8105
venv = true
model = "jhu-clsp/mmBERT-small"
revision = "abc32620"
backend = "torch-mps"
precision = "fp32"
request_model = "classifier-{dataset}"
install = "uv pip install torch transformers accelerate pyarrow"
start = "python shims/classifier_shim.py --port 8105"

# Architecture-study arms (docs/architecture-study.md), served from training/ckpt/<arm>.
# Train first: scripts/arch-study.sh. All arms share the arch-b environment.
[arch-b]
port = 8120
venv = true
model = "arch-b"
backend = "torch-mps"
precision = "fp32"
install = "uv pip install -e ../../benchmarks -e ../../training"
start = "python shims/arch_shim.py --ckpt ../../training/ckpt/b --port 8120"

