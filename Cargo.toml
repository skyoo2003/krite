[workspace]
resolver = "3"
members = ["crates/*", "python"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/skyoo2003/krite"
readme = "README.md"

[workspace.dependencies]
krite-core = { path = "crates/krite-core", version = "0.2.0" }
krite-runtime = { path = "crates/krite-runtime", version = "0.2.0" }
krite-candle = { path = "crates/krite-candle", version = "0.2.0" }
krite-server = { path = "crates/krite-server", version = "0.2.0" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact number parsing, so the RFC 8785 state string is exact
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
