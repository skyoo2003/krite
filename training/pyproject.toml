[project]
name = "krite-train"
version = "0.1.0"
readme = "README.md"
description = "Training code for Krite architecture studies (torch, MPS)"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "huggingface_hub>=0.23",
  "krite-bench>=0.1,<0.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "torch>=2.14,<2.15",
  "transformers>=5.18,<5.19",
]

[project.urls]
Repository = "https://github.com/skyoo2003/krite"

[tool.uv.sources]
krite-bench = { path = "../benchmarks", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/krite_train"]

[tool.hatch.build.targets.wheel]
packages = ["krite_train"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs Hugging Face Hub access (cached after first run)"]
