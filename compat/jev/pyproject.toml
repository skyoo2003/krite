[project]
name = "krite-compat-jev"
version = "0.0.0"
description = "Jev wire conformance: drives a Krite server through the official TypeSafe Python SDK"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["typesafe-sdk==0.7.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
